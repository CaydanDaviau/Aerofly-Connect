name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-client/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Signing key comes from repository secrets, never from the repo.
      # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #          ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Prepare signing key (if secrets exist)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using release key from secrets."
          else
            echo "::warning::No signing secrets set. Building with the temporary debug key; updates will not install over older builds."
          fi

      - name: Build
        working-directory: android-client
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp android-client/app/build/outputs/apk/release/app-release.apk AFConnect.apk

      # The rolling release's "Source code" download follows its tag, so move the tag to this commit.
      - name: Point the release tag at this commit
        run: |
          git tag -f android-latest "$GITHUB_SHA"
          git push origin android-latest --force

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build ${{ github.run_number }} from commit ${GITHUB_SHA::7}"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest AFConnect.apk --clobber
            gh release delete-asset android-latest abflug-revival.apk --yes || true   # old name
            gh release edit android-latest --notes "$NOTES"
          else
            gh release create android-latest AFConnect.apk --title "Latest Android build" --notes "$NOTES"
          fi
          echo "### Download" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/android-latest/AFConnect.apk" >> "$GITHUB_STEP_SUMMARY"
