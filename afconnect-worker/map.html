<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Abflug Revival map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
html,body,#map{margin:0;height:100%;width:100%;background:#dde}
body{font:13px system-ui,sans-serif}
#bar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
#bar button,#bar .pill{pointer-events:auto;border:0;border-radius:18px;padding:8px 12px;background:rgba(20,24,30,.82);color:#fff;font:600 13px system-ui}
#bar button.on{background:#1a73e8}
#info{position:absolute;left:8px;bottom:22px;background:rgba(20,24,30,.82);color:#fff;border-radius:8px;padding:5px 9px;font:12px ui-monospace,monospace}
body.pip #bar,body.pip #info,body.pip .maplibregl-ctrl-attrib{display:none!important}
</style></head><body>
<div id="map"></div>
<div id="bar">
  <button id="bFollow" class="on">Follow</button>
  <button id="bHdg">North up</button>
  <button id="bStyle">Map: Liberty</button>
  <button id="bPip" style="display:none">PiP</button>
</div>
<div id="info">starting...</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function(){
var P=new URLSearchParams(location.search), KEY=P.get('key')||'', BASE=location.origin;
var STYLES=[['Liberty','https://tiles.openfreemap.org/styles/liberty'],['Positron','https://tiles.openfreemap.org/styles/positron'],['Bright','https://tiles.openfreemap.org/styles/bright']];
var si=0; try{si=Math.min(STYLES.length-1,Math.max(0,parseInt(localStorage.getItem('rv_style')||'0',10)||0))}catch(e){}
var own=null, follow=true, hdgUp=false, trails={}, ttimes={}, lastTraffic=[], lastCrashes=[], towers=[], ready=false;
var TRACE_MS=30*60*1000, GAP_MS=60000, TK='afc_trails_v1';
// traces live 30 min and survive closing the map (saved in the WebView's local storage)
function loadTrails(){try{var j=JSON.parse(localStorage.getItem(TK)||'null');if(!j||!j.tr)return;var now=Date.now();
  Object.keys(j.tr).forEach(function(id){var o=j.tr[id],c=[],ts=[];if(!o||!o.t)return;
    for(var i=0;i<o.t.length;i++){if(now-o.t[i]<=TRACE_MS){c.push(o.c[i]);ts.push(o.t[i])}}
    if(c.length){trails[id]=c;ttimes[id]=ts}})}catch(e){}}
function saveTrails(){try{var now=Date.now(),o={};
  Object.keys(trails).forEach(function(id){var ts=ttimes[id];if(!ts||!ts.length||now-ts[ts.length-1]>TRACE_MS)return;
    var c=[],t=[];for(var i=0;i<ts.length;i++){if(now-ts[i]<=TRACE_MS){c.push([Math.round(trails[id][i][0]*1e5)/1e5,Math.round(trails[id][i][1]*1e5)/1e5]);t.push(ts[i])}}
    if(c.length)o[id]={c:c,t:t}});
  localStorage.setItem(TK,JSON.stringify({tr:o}))}catch(e){}}
window.saveTrails=saveTrails;
function segs(id){var t=trails[id],ts=ttimes[id];if(!t||t.length<2)return[];var out=[],cur=[t[0]];
  for(var i=1;i<t.length;i++){if(ts[i]-ts[i-1]>GAP_MS){if(cur.length>1)out.push(cur);cur=[]}cur.push(t[i])}
  if(cur.length>1)out.push(cur);return out}
loadTrails();
var info=document.getElementById('info');
function setInfo(t){info.textContent=t}

var map=new maplibregl.Map({container:'map',style:STYLES[si][1],center:[-47.92,-15.87],zoom:12,attributionControl:{compact:true},pitchWithRotate:false,dragRotate:true});
document.getElementById('bStyle').textContent='Map: '+STYLES[si][0];
map.on('dragstart',function(){ if(follow) setFollow(false) });

// ---- icons (drawn, SDF so colour comes from data) ----
function icon(draw,size){var c=document.createElement('canvas');c.width=c.height=size;var g=c.getContext('2d');g.fillStyle='#000';draw(g,size);return g.getImageData(0,0,size,size)}
function planeShape(g,s){var k=s/64;g.save();g.scale(k,k);g.beginPath();
  g.moveTo(32,3);g.quadraticCurveTo(36,6,36,18);g.lineTo(36,26);g.lineTo(60,40);g.lineTo(60,45);g.lineTo(36,38);g.lineTo(36,50);g.lineTo(45,57);g.lineTo(45,61);g.lineTo(32,57);
  g.lineTo(19,61);g.lineTo(19,57);g.lineTo(28,50);g.lineTo(28,38);g.lineTo(4,45);g.lineTo(4,40);g.lineTo(28,26);g.lineTo(28,18);g.quadraticCurveTo(28,6,32,3);g.closePath();g.fill();g.restore()}
function towerShape(g,s){var k=s/64;g.save();g.scale(k,k);
  g.beginPath();g.moveTo(27,30);g.lineTo(37,30);g.lineTo(40,58);g.lineTo(24,58);g.closePath();g.fill();   // shaft
  g.fillRect(18,58,28,5);                                                                                   // base
  g.beginPath();g.moveTo(10,13);g.lineTo(54,13);g.lineTo(46,30);g.lineTo(18,30);g.closePath();g.fill();   // glass cab
  g.fillRect(13,9,38,4);g.fillRect(31,1,2,8);                                                               // roof + antenna
  g.globalCompositeOperation='destination-out';                                                             // windows
  g.fillRect(20,15,5,9);g.fillRect(29.5,15,5,9);g.fillRect(39,15,5,9);g.restore()}
function addIcons(){
  if(!map.hasImage('plane'))map.addImage('plane',icon(planeShape,64),{sdf:true});
  if(!map.hasImage('tower'))map.addImage('tower',icon(towerShape,64),{sdf:true});
}

// ---- layers (re-added after every style change) ----
var EMPTY={type:'FeatureCollection',features:[]};
function addLayers(){
  addIcons();
  ['trails','planes','towers','ownsrc','crashes'].forEach(function(id){ if(!map.getSource(id))map.addSource(id,{type:'geojson',data:EMPTY}) });
  var halo={'text-halo-color':'#fff','text-halo-width':1.6};
  if(!map.getLayer('trails'))map.addLayer({id:'trails',type:'line',source:'trails',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['get','c'],'line-width':2.5,'line-opacity':.65}});
  if(!map.getLayer('towers'))map.addLayer({id:'towers',type:'symbol',source:'towers',layout:{'icon-image':'tower','icon-size':.7,'icon-allow-overlap':true,'text-field':['get','label'],'text-font':['Noto Sans Bold'],'text-size':12,'text-offset':[0,1.9],'text-anchor':'top','text-allow-overlap':true},paint:{'icon-color':['case',['==',['get','m'],1],'#d9a400','#c2189a'],'icon-halo-color':'#fff','icon-halo-width':1.2,'text-color':['case',['==',['get','m'],1],'#7a5a00','#7a0f62'],'text-halo-color':'#fff','text-halo-width':1.6}});
  if(!map.getLayer('planes'))map.addLayer({id:'planes',type:'symbol',source:'planes',layout:{'icon-image':'plane','icon-size':.55,'icon-rotate':['get','h'],'icon-rotation-alignment':'map','icon-allow-overlap':true,'icon-ignore-placement':true,'text-field':['get','label'],'text-font':['Noto Sans Bold'],'text-size':12,'text-offset':[1.4,0],'text-anchor':'left','text-optional':true},paint:{'icon-color':['case',['==',['get','m'],1],'#7b3fe4','#e8710a'],'text-color':['case',['==',['get','m'],1],'#3d1b80','#7a3600'],'text-halo-color':'#fff','text-halo-width':1.6}});
  if(!map.getLayer('own'))map.addLayer({id:'own',type:'symbol',source:'ownsrc',layout:{'icon-image':'plane','icon-size':.65,'icon-rotate':['get','h'],'icon-rotation-alignment':'map','icon-allow-overlap':true,'icon-ignore-placement':true,'text-field':['get','label'],'text-font':['Noto Sans Bold'],'text-size':12,'text-offset':[1.6,0],'text-anchor':'left','text-optional':true},paint:{'icon-color':'#1a73e8','text-color':'#0b3d91','text-halo-color':'#fff','text-halo-width':1.6}});
  var hl={'text-font':['Noto Sans Bold'],'text-size':12,'text-allow-overlap':true,'text-ignore-placement':true};
  var pt2={'text-color':'#0b3d91','text-halo-color':'#fff','text-halo-width':1.6};
  if(!map.getLayer('ownleft'))map.addLayer({id:'ownleft',type:'symbol',source:'ownsrc',layout:Object.assign({'text-field':['get','left'],'text-anchor':'right','text-justify':'right','text-offset':[-2.3,0]},hl),paint:pt2});
  if(!map.getLayer('ownfpm'))map.addLayer({id:'ownfpm',type:'symbol',source:'ownsrc',filter:['!=',['get','fpm'],''],layout:Object.assign({'text-field':['get','fpm'],'text-anchor':'top','text-offset':[0,2.4]},hl),paint:{'text-color':'#b3261e','text-halo-color':'#fff','text-halo-width':1.8}});
  if(!map.getLayer('crashx'))map.addLayer({id:'crashx',type:'symbol',source:'crashes',layout:{'text-field':'X','text-font':['Noto Sans Bold'],'text-size':34,'text-allow-overlap':true,'text-ignore-placement':true},paint:{'text-color':'#d93025','text-halo-color':'#fff','text-halo-width':2.2}});
  if(!map.getLayer('crashlbl'))map.addLayer({id:'crashlbl',type:'symbol',source:'crashes',layout:{'text-field':['get','label'],'text-font':['Noto Sans Bold'],'text-size':12,'text-anchor':'top','text-offset':[0,1.2],'text-allow-overlap':true,'text-ignore-placement':true},paint:{'text-color':'#b3261e','text-halo-color':'#fff','text-halo-width':1.8}});
  ready=true; render();
}
map.on('style.load',addLayers);
map.on('styledata',function(){ if(map.isStyleLoaded()&&!map.getLayer('planes'))addLayers() });
map.on('idle',function(){ if(!map.getLayer('planes')||!map.hasImage('plane')){ready=false;addLayers()} });

// ---- data ----
function altStr(a){a=Number(a);if(!isFinite(a))return'';return a>=5000?'FL'+String(Math.round(a/100)).padStart(3,'0'):Math.round(a)+' ft'}
function etaStr(m){m=Number(m);if(!isFinite(m)||m<0)return'--';return m>=60?Math.floor(m/60)+'h'+String(m%60).padStart(2,'0'):m+' min'}
function fpmStr(v){v=Number(v);return isFinite(v)?Math.round(v)+' fpm':''}
function pt(lon,lat,props){return{type:'Feature',geometry:{type:'Point',coordinates:[lon,lat]},properties:props}}
function render(){
  if(!map.isStyleLoaded()&&!map.getSource('planes'))return;
  if(!map.getSource('planes')||!map.getLayer('own')||!map.hasImage('plane')){ if(map.isStyleLoaded())addLayers(); else return }
  var pl=[],tw=[],tr=[],compact=document.body.classList.contains('pip');
  lastTraffic.forEach(function(a){
    var id=a.icao_address||a.callsign;
    if(a.virtual_tower){tw.push(pt(a.longitude,a.latitude,{label:a.callsign||'TWR',m:a.member?1:0}));return}
    if(a.self)return;
    pl.push(pt(a.longitude,a.latitude,{label:a.callsign||id,h:Number(a.heading_true)||0,id:String(id),m:a.member?1:0}));
    var sg=segs(id);if(sg.length)tr.push({type:'Feature',geometry:{type:'MultiLineString',coordinates:sg},properties:{c:a.member?'#7b3fe4':'#e8710a'}});
  });
  map.getSource('planes').setData({type:'FeatureCollection',features:pl});
  map.getSource('towers').setData({type:'FeatureCollection',features:tw});
  var ow=[];
  if(own){
    ow.push(pt(own.lon,own.lat,{label:own.callsign||'YOU',h:own.hdg||0,left:'ETA: '+etaStr(own.eta)+'\nALT: '+altStr(own.alt),fpm:own.fpm==null?'':fpmStr(own.fpm)}));
    var os=segs('__own');if(os.length)tr.push({type:'Feature',geometry:{type:'MultiLineString',coordinates:os},properties:{c:'#1a73e8'}});
  }
  map.getSource('ownsrc').setData({type:'FeatureCollection',features:ow});
  map.getSource('trails').setData({type:'FeatureCollection',features:tr});
  if(map.getSource('crashes'))map.getSource('crashes').setData({type:'FeatureCollection',features:lastCrashes.map(function(c){return pt(c.longitude,c.latitude,{label:'CRASH '+(c.callsign||'')})})});
}
function pushTrail(id,lon,lat){
  var now=Date.now(),t=trails[id]||(trails[id]=[]),ts=ttimes[id]||(ttimes[id]=[]),n=t.length,l=t[n-1];
  var minGap=id==='__own'?2500:9000;   // own: ~3 s, others: ~10 s (keeps 30 min light)
  if(!l||(now-ts[n-1]>=minGap&&(Math.abs(l[0]-lon)>1e-5||Math.abs(l[1]-lat)>1e-5))){t.push([lon,lat]);ts.push(now)}
  while(ts.length&&now-ts[0]>TRACE_MS){t.shift();ts.shift()}
}
// full own trace recorded by the app service (no hole while the map was closed)
window.setOwnTrace=function(a){
  if(!a||!a.length)return;
  var first=a[0][2],t=trails.__own||[],tt=ttimes.__own||[],c=[],ts=[],i;
  for(i=0;i<t.length;i++){if(tt[i]<first){c.push(t[i]);ts.push(tt[i])}}
  for(i=0;i<a.length;i++){c.push([a[i][0],a[i][1]]);ts.push(a[i][2])}
  trails.__own=c;ttimes.__own=ts;render();
};
setInterval(saveTrails,10000);
document.addEventListener('visibilitychange',function(){if(document.hidden)saveTrails()});
window.addEventListener('pagehide',saveTrails);
function followNow(){
  if(!follow||!own)return;
  var o={center:[own.lon,own.lat],duration:900,essential:true};
  if(hdgUp)o.bearing=own.hdg||0;
  map.easeTo(o);
}

// own plane: pushed by the Android app (sim data), also taken from traffic.self as a fallback
window.setOwn=function(lat,lon,hdg,gs,alt,callsign,eta,fpm){
  own={lat:lat,lon:lon,hdg:hdg,gs:gs,alt:alt,callsign:callsign||'',eta:eta,fpm:fpm};
  pushTrail('__own',lon,lat);render();followNow();
};
window.zoomBy=function(d){map.easeTo({zoom:map.getZoom()+d,duration:200})};
window.setPip=function(on){document.body.classList.toggle('pip',!!on);render();map.resize()};

var firstFix=true, failures=0, lastPush=0, paused=false;
function applyTraffic(d){
  failures=0;lastTraffic=d.aircraft||[];lastCrashes=d.crashes||[];
  lastTraffic.forEach(function(a){
    if(a.virtual_tower)return;
    var id=a.icao_address||a.callsign;
    if(a.self){ if(!window.__appOwn){own={lat:a.latitude,lon:a.longitude,hdg:Number(a.heading_true)||0,alt:a.altitude_ft,callsign:a.callsign};pushTrail('__own',a.longitude,a.latitude);followNow()} }
    else pushTrail(id,a.longitude,a.latitude);
  });
  if(firstFix&&own){firstFix=false;map.jumpTo({center:[own.lon,own.lat],zoom:13})}
  var nt=lastTraffic.filter(function(a){return a.virtual_tower}).length, n=lastTraffic.length-nt;
  setInfo(n+' aircraft'+' · '+nt+(nt===1?' tower':' towers')+(lastTraffic.some(function(a){return a.member})?' · purple/gold = group':'')+(KEY?'':' · view only'));
  render();
}
// traffic pushed by the Android app (it comes back with the position upload, no extra request)
window.setTraffic=function(d){lastPush=Date.now();applyTraffic(d)};
// the app tells us when the map is hidden: no polling then
window.setActive=function(on){paused=!on;if(on)poll()};
function poll(){
  if(paused||document.hidden)return;
  if(Date.now()-lastPush<10000)return;   // pushed feed (app or socket) is fresh
  var c=own?{lat:own.lat,lon:own.lon}:{lat:map.getCenter().lat,lon:map.getCenter().lng};
  fetch(BASE+'/api/traffic?lat='+c.lat+'&lon='+c.lon+'&radius_miles=13000',{headers:{'X-API-Key':KEY||'viewer'}})
   .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
   .then(applyTraffic).catch(function(e){failures++;setInfo('server error: '+e.message)});
}
setInterval(poll,3000);poll();
// Browser only (in the app the service feeds us): WebSocket push, polling above is the fallback while it is silent
var ws=null,wsTimer=0,wsPing=0,wsTry=0,wsAt=0;
function wsOpen(){
  if(window.Android||!KEY||!window.WebSocket||ws)return;
  try{ws=new WebSocket(BASE.replace(/^http/,'ws')+'/ws?key='+encodeURIComponent(KEY))}catch(e){ws=null;return}
  var me=ws;
  me.onopen=function(){wsTry=0;me.send(JSON.stringify({sub:{lat:0,lon:0,radius_miles:13000,max:300}}));
    clearInterval(wsPing);wsPing=setInterval(function(){if(me.readyState===1)me.send('ping')},25000)};
  me.onmessage=function(e){if(e.data==='pong')return;var j;try{j=JSON.parse(e.data)}catch(x){return}
    if(j&&j.push==='traffic'){wsAt=Date.now();lastPush=wsAt;applyTraffic(j)}};
  me.onclose=function(){if(ws===me)ws=null;clearInterval(wsPing);
    clearTimeout(wsTimer);wsTimer=setTimeout(wsOpen,Math.min(30000,2000*Math.pow(2,Math.min(wsTry++,4))))};
  me.onerror=function(){try{me.close()}catch(x){}};
}
wsOpen();
document.addEventListener('visibilitychange',function(){if(!document.hidden){if(!ws)wsOpen();poll()}});

// ---- tap another aircraft: details popup ----
var popup=null;
function row(parent,k,v){if(v===''||v==null)return;var d=document.createElement('div');var b=document.createElement('b');b.textContent=k+' ';d.appendChild(b);d.appendChild(document.createTextNode(v));parent.appendChild(d)}
map.on('click','planes',function(e){
  var f=e.features&&e.features[0];if(!f)return;
  var a=lastTraffic.filter(function(x){return String(x.icao_address||x.callsign)===f.properties.id})[0];if(!a)return;
  var box=document.createElement('div');box.style.cssText='font:12px system-ui,sans-serif;color:#111;line-height:1.45';
  var t=document.createElement('div');t.style.cssText='font:700 14px system-ui,sans-serif';t.textContent=a.callsign||a.icao_address;box.appendChild(t);
  row(box,'Aircraft:',a.airplane_model||'');
  row(box,'Route:',[a.departure_airport,a.arrival_airport].filter(Boolean).join(' → '));
  row(box,'ALT:',altStr(a.altitude_ft));
  row(box,'ETA:',a.eta_min!=null?etaStr(a.eta_min):'');
  row(box,'Landing:',a.landing_fpm!=null?fpmStr(a.landing_fpm):'');
  row(box,'Squawk:',a.assigned_squawk||'');
  if(popup)popup.remove();
  popup=new maplibregl.Popup({closeButton:true,maxWidth:'220px',offset:14}).setLngLat(e.lngLat).setDOMContent(box).addTo(map);
});
map.on('mouseenter','planes',function(){map.getCanvas().style.cursor='pointer'});
map.on('mouseleave','planes',function(){map.getCanvas().style.cursor=''});

// ---- controls ----
function setFollow(v){follow=v;document.getElementById('bFollow').classList.toggle('on',v);if(v)followNow()}
document.getElementById('bFollow').onclick=function(){setFollow(!follow)};
document.getElementById('bHdg').onclick=function(){hdgUp=!hdgUp;this.textContent=hdgUp?'Heading up':'North up';this.classList.toggle('on',hdgUp);if(!hdgUp)map.easeTo({bearing:0,duration:400});else followNow()};
document.getElementById('bStyle').onclick=function(){
  si=(si+1)%STYLES.length;try{localStorage.setItem('rv_style',String(si))}catch(e){}
  this.textContent='Map: '+STYLES[si][0];ready=false;map.setStyle(STYLES[si][1]);
};
if(window.Android&&window.Android.pip){var b=document.getElementById('bPip');b.style.display='';b.onclick=function(){window.Android.pip()}}
if(!window.Android)window.addEventListener('resize',function(){document.body.classList.toggle('pip',window.innerWidth<420&&window.innerHeight<420)});
})();
</script></body></html>
