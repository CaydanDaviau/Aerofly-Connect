name = "abflug-community"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true
keep_vars = true   # keep dashboard-set vars (GROUP_CODE) when Workers Builds redeploys

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Optional: restrict access. Leave unset for "any key works".
# [vars]
# DEBUG = "1"   # logs request bodies (view in dashboard Logs)
# ABFLUG_KEYS = "key1,key2"

[observability]
enabled = true
