<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATC Credentials</title>
<style>
:root{--bg:#00414B;--card:#012C33;--stroke:#1E7480;--acc:#4FE3D0;--txt:#E8F6F5;--dim:#8FBCC0;--red:#E5584D;--grn:#5CE0A0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,sans-serif;padding:16px}
.w{max-width:560px;margin:0 auto}h1{font-size:20px;color:var(--acc);margin:4px 0 14px}
.c{background:var(--card);border:1px solid var(--stroke);border-radius:14px;padding:14px;margin-bottom:12px}
input{width:100%;background:#01242A;color:var(--txt);border:1px solid var(--stroke);border-radius:10px;padding:11px;font-size:15px;margin:6px 0}
button{background:var(--acc);color:#00282e;border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
button.s{background:transparent;color:var(--acc);border:1px solid var(--stroke)}button.d{background:transparent;color:var(--red);border:1px solid var(--red)}
.r{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--stroke)}.r:first-of-type{border-top:0}
.r .n{flex:1;min-width:0}.n b{display:block}.n code{color:var(--grn);font-size:14px;word-break:break-all}.n small{color:var(--dim)}
.dim{color:var(--dim);font-size:13px}.msg{min-height:18px;margin-top:8px;font-size:13px}.err{color:var(--red)}
</style></head><body><div class="w">
<h1>ATC Credentials</h1>
<div class="c" id="login"><div class="dim">Manager code</div><input id="mc" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="go">Sign in</button><div class="msg" id="lm"></div></div>
<div id="panel" hidden>
<div class="c"><div class="dim">New controller credential</div><input id="nm" maxlength="40" placeholder="Controller name"><button id="gen">Generate</button><div class="msg" id="gm"></div></div>
<div class="c"><div class="dim" style="margin-bottom:6px">Active credentials</div><div id="list"></div></div>
<button class="s" id="out">Sign out</button>
</div></div>
<script>
const $=id=>document.getElementById(id);
let mk="",mc="";try{mk=localStorage.getItem("afc_mkey")||"";mc=localStorage.getItem("afc_mgr")||"";}catch(e){}
if(!mk){mk="mgr"+[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,"0")).join("");try{localStorage.setItem("afc_mkey",mk)}catch(e){}}
async function api(m,p,b){const r=await fetch(p,{method:m,headers:{"X-API-Key":mk,"X-Manager":mc,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}return{s:r.status,j}}
function show(on){$("login").hidden=on;$("panel").hidden=!on}
async function signin(code){mc=code.trim();const h=await api("GET","/api/health");if(h.s===200&&h.j.mgr){try{localStorage.setItem("afc_mgr",mc)}catch(e){}show(true);load();return true}mc="";return false}
$("go").onclick=async()=>{$("lm").textContent="";if(!await signin($("mc").value)){$("lm").className="msg err";$("lm").textContent="Wrong manager code"}};
$("mc").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("out").onclick=()=>{try{localStorage.removeItem("afc_mgr")}catch(e){}mc="";show(false);$("mc").value=""};
async function load(){const r=await api("GET","/api/manager/creds");if(r.s!==200){show(false);return}const L=$("list");L.textContent="";
 if(!r.j.creds.length){const d=document.createElement("div");d.className="dim";d.textContent="No credentials yet.";L.appendChild(d)}
 for(const c of r.j.creds){const row=document.createElement("div");row.className="r";const n=document.createElement("div");n.className="n";
  const b=document.createElement("b");b.textContent=c.name;const k=document.createElement("code");k.textContent=c.code;const sm=document.createElement("small");sm.textContent=" "+new Date(c.at).toLocaleDateString();
  n.append(b,k,sm);const cp=document.createElement("button");cp.className="s";cp.textContent="Copy";cp.onclick=async()=>{try{await navigator.clipboard.writeText(c.code);cp.textContent="Copied"}catch(e){prompt("Credential",c.code)}};
  const rv=document.createElement("button");rv.className="d";rv.textContent="Revoke";rv.onclick=async()=>{if(!confirm("Revoke "+c.name+"? Their access ends immediately."))return;await api("DELETE","/api/manager/creds?code="+encodeURIComponent(c.code));load()};
  row.append(n,cp,rv);L.appendChild(row)}}
$("gen").onclick=async()=>{const nm=$("nm").value.trim();$("gm").className="msg";if(!nm){$("gm").className="msg err";$("gm").textContent="Enter a name";return}
 const r=await api("PUT","/api/manager/creds",{name:nm});if(r.s!==200){$("gm").className="msg err";$("gm").textContent="Failed ("+(r.j.error||r.s)+")";return}
 $("nm").value="";$("gm").textContent="Created: "+r.j.code;load()};
if(mc)signin(mc);
</script></body></html>
