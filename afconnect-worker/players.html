<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Players</title>
<style>
:root{--bg:#00414B;--card:#012C33;--stroke:#1E7480;--acc:#4FE3D0;--txt:#E8F6F5;--dim:#8FBCC0;--red:#E5584D;--grn:#5CE0A0;--amb:#ffc400}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,sans-serif;padding:16px}
.w{max-width:640px;margin:0 auto}h1{font-size:20px;color:var(--acc);margin:4px 0 14px}
.c{background:var(--card);border:1px solid var(--stroke);border-radius:14px;padding:14px;margin-bottom:12px}
input{width:100%;background:#01242A;color:var(--txt);border:1px solid var(--stroke);border-radius:10px;padding:10px;font-size:15px;margin:4px 0}
button{background:var(--acc);color:#00282e;border:0;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px}
button.s{background:transparent;color:var(--acc);border:1px solid var(--stroke)}button.d{background:transparent;color:var(--red);border:1px solid var(--red)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}.row input{width:auto;flex:1;min-width:70px;margin:0}
.b{display:inline-block;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:700;margin-left:6px}
.on{background:var(--grn);color:#00282e}.ban{background:var(--red);color:#fff}.to{background:var(--amb);color:#00282e}.gm{border:1px solid var(--acc);color:var(--acc)}
.dim{color:var(--dim);font-size:13px}.msg{min-height:18px;margin-top:6px;font-size:13px}.err{color:var(--red)}a{color:var(--acc)}
</style></head><body><div class="w">
<h1>Players</h1>
<div class="c" id="login"><div class="dim">Manager code</div><input id="mc" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="go">Sign in</button><div class="msg" id="lm"></div></div>
<div id="panel" hidden>
<div class="c"><input id="q" placeholder="Search name, nickname, callsign" autocomplete="off"><div class="row"><input id="rs" maxlength="120" placeholder="Reason (optional, for timeout / ban)"></div><div class="msg" id="gm"></div></div>
<div id="list"></div>
<div class="dim" style="margin:8px 0"><a href="/manager">ATC credentials</a> · <a href="#" id="out">Sign out</a></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
let mk="",mc="";try{mk=localStorage.getItem("afc_mkey")||"";mc=localStorage.getItem("afc_mgr")||"";}catch(e){}
if(!mk){mk="mgr"+[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,"0")).join("");try{localStorage.setItem("afc_mkey",mk)}catch(e){}}
async function api(m,p,b){const r=await fetch(p,{method:m,headers:{"X-API-Key":mk,"X-Manager":mc,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}return{s:r.status,j}}
function show(on){$("login").hidden=on;$("panel").hidden=!on}
async function signin(code){mc=code.trim();const h=await api("GET","/api/health");if(h.s===200&&h.j.mgr){try{localStorage.setItem("afc_mgr",mc)}catch(e){}show(true);load();return true}mc="";return false}
$("go").onclick=async()=>{$("lm").textContent="";if(!await signin($("mc").value)){$("lm").className="msg err";$("lm").textContent="Wrong manager code"}};
$("mc").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("out").onclick=e=>{e.preventDefault();try{localStorage.removeItem("afc_mgr")}catch(x){}mc="";show(false);$("mc").value=""};
const hm=s=>Math.floor(s/3600)+"h"+String(Math.floor(s%3600/60)).padStart(2,"0");
const mmss=s=>s>=3600?hm(s):Math.floor(s/60)+" min";
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function msg(t,bad){$("gm").className="msg"+(bad?" err":"");$("gm").textContent=t}
async function act(id,action,extra){const r=await api("POST","/api/manager/player",{id,action,reason:$("rs").value,...(extra||{})});
 if(r.s!==200){msg("Failed: "+(r.j.error||r.s),true);return}msg("Done: "+action);load()}
function card(p){const c=el("div","c"),h=el("div");const nm=p.name||p.nick||"(device "+p.id.slice(2,8)+")";
 h.append(el("b",null,nm));if(p.name&&p.nick)h.append(el("span","dim"," · "+p.nick));
 if(p.online)h.append(el("span","b on","ONLINE"+(p.callsign?" "+p.callsign:"")));
 if(p.banned)h.append(el("span","b ban","BANNED"));if(p.timeout_s)h.append(el("span","b to","TIMEOUT "+mmss(p.timeout_s)));
 c.append(h);
 c.append(el("div","dim",(p.account?"Account":"Device")+" · pilot "+p.pilot_grade+" · "+hm(p.flight_s)+" flown · "+p.flights+" flights · "+p.landings+" landings · score "+p.rep+" ("+p.stars+"★)"));
 const g=el("div","dim","ATC "+hm(p.atc_s)+" · controller grade ");g.append(el("b",null,p.atc_grade_name));if(p.grade_manual)g.append(el("span","b gm","MANUAL"));c.append(g);
 if(p.banned&&p.ban_reason)c.append(el("div","dim","Ban: "+p.ban_reason));if(p.timeout_s&&p.timeout_reason)c.append(el("div","dim","Timeout: "+p.timeout_reason));
 const r1=el("div","row"),bt=(t,cl,f)=>{const b=el("button",cl,t);b.onclick=f;return b};
 r1.append(bt("Promote","",()=>act(p.id,"promote")),bt("Demote","s",()=>act(p.id,"demote")));if(p.grade_manual)r1.append(bt("Auto grade","s",()=>act(p.id,"grade_auto")));
 c.append(r1);
 const r2=el("div","row"),mi=el("input");mi.type="number";mi.min=1;mi.placeholder="minutes";r2.append(mi,bt("Timeout","d",()=>{const n=parseInt(mi.value);if(!(n>=1)){msg("Enter minutes",true);return}act(p.id,"timeout",{minutes:n})}));
 if(p.timeout_s)r2.append(bt("End timeout","s",()=>act(p.id,"untimeout")));
 r2.append(p.banned?bt("Unban","s",()=>act(p.id,"unban")):bt("Ban","d",()=>{if(confirm("Ban "+nm+" from flying and ATC?"))act(p.id,"ban")}));
 c.append(r2);
 const r3=el("div","row"),ed=el("div","row");ed.hidden=true;const F=[["rep","Conduct score"]],ins={};
 for(const [k,l] of F){const w=el("div","dim",l),i=el("input");i.type="number";i.min=0;i.value=p[k]??0;i.style.width="64px";ins[k]=i;w.append(i);ed.append(w)}
 ed.append(bt("Save","",()=>{const st={};for(const k in ins)st[k]=ins[k].value;act(p.id,"set_stats",{stats:st})}));
 r3.append(bt("Edit conduct score","s",()=>{ed.hidden=!ed.hidden}),bt("Reset conduct score to 500","d",()=>{if(confirm("Reset conduct score to 500 and end any active timeout for "+nm+"?"))act(p.id,"reset_penalties")}));
 c.append(r3,ed);return c}
let seq=0;
async function load(){const n=++seq,r=await api("GET","/api/manager/players?q="+encodeURIComponent($("q").value.trim()));if(n!==seq)return;if(r.s!==200){show(false);return}
 const L=$("list");L.textContent="";if(!r.j.players.length)L.append(el("div","dim","No players found."));
 else if(r.j.total>r.j.players.length)L.append(el("div","dim","Showing "+r.j.players.length+" of "+r.j.total+" - search to narrow down."));
 for(const p of r.j.players)L.append(card(p))}
let tm;$("q").oninput=()=>{clearTimeout(tm);tm=setTimeout(load,300)};
if(mc)signin(mc);
</script></body></html>
