<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abflug ATC Radar</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--bg:#040704;--panel:#09110b;--fg:#3dff7a;--dim:#1b7a3d;--faint:#0f3a1f;--amber:#ffb000;--red:#ff4545;--cy:#7ae9ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.35 ui-monospace,Menlo,Consolas,monospace}
#app{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--dim)}
#bar{position:relative}#menu{position:absolute;left:10px;top:100%;z-index:50;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--panel);border:1px solid var(--dim);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.5)}#menu button{text-align:left;min-width:170px}
#bar b{letter-spacing:.12em}
#status{margin-left:auto;color:var(--dim)}
#status.ok{color:var(--fg)}
button,select,input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--dim);border-radius:4px;padding:5px 8px}
button{cursor:pointer}
button:active{background:var(--faint)}
input::placeholder{color:var(--dim)}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
#scope{position:relative;flex:1 1 55%;min-height:200px;touch-action:none}
#radar{position:absolute;inset:0;width:100%;height:100%;display:block}
#strips{flex:1 1 45%;min-height:0;overflow:auto;border-top:1px solid var(--dim);padding:6px}
@media (min-aspect-ratio:5/4){#main{flex-direction:row}#strips{flex:0 0 380px;border-top:0;border-left:1px solid var(--dim)}}
.strip{border:1px solid var(--faint);border-left:4px solid var(--dim);border-radius:4px;padding:6px 8px;margin-bottom:6px;background:var(--panel)}
.strip.dim{opacity:.38}
.strip.sel{border-color:var(--cy);border-left-color:var(--cy)}
.strip.twr{border-left-color:#ff7ae9}
.strip.nocode{border-left-color:var(--amber)}
.strip.noclnc{border-color:var(--amber);border-left-color:var(--amber)}
.strip.emerg{border-color:#ff3b30;border-left-color:#ff3b30;background:#3a0f0c}
.mayday{background:#ff3b30;color:#fff;font-weight:700;border-radius:3px;padding:0 5px;margin-left:6px}
.strip.nc-taxi{border-color:#ffd23f;border-left-color:#ffd23f}.strip.nc-runway,.strip.nc-landing{border-color:#ff9f1c;border-left-color:#ff9f1c}.strip.nc-alt{border-color:#c8e04a;border-left-color:#c8e04a}
.noc.nc-taxi{background:#ffd23f}.noc.nc-runway,.noc.nc-landing{background:#ff9f1c}.noc.nc-alt{background:#c8e04a}
.clr{color:var(--cy)}.ctl button.on{background:var(--fg);color:#000}.ctl input#altin{width:64px;font-weight:700}
.noc{background:var(--amber);color:#000;font-weight:700;border-radius:3px;padding:0 5px;margin-left:6px}
.strip .h{display:flex;justify-content:space-between;gap:8px}
.strip .cs{font-weight:700;font-size:14px}
.strip .m{color:var(--dim)}
.strip .pt{font-size:11px;color:var(--cy);letter-spacing:.5px}
.strip .route{color:var(--fg);word-break:break-word}
.ok{color:var(--fg)}.warn{color:var(--amber)}.bad{color:var(--red)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.ctl input{width:84px;text-align:center;letter-spacing:.2em}
.ctl.hdg button{flex:1 1 auto}.ctl input#hdgin{width:64px;font-weight:700}
.ctl input#msgin{flex:1 1 140px;width:auto;text-align:left;letter-spacing:0}
.urg{display:flex;align-items:center;gap:4px;white-space:nowrap}.urg input{width:auto;letter-spacing:0}
.mlog{font-size:12px;margin-top:4px;color:var(--dim2,#8aa)}.mlog b.wilco{color:#3dff7a}.mlog b.unable{color:#ff6b6b}.mlog.chat{color:#4fe3d0;font-size:13px}.mlog.chat b{color:#4fe3d0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--fg);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#login{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:20px}
#login div{background:var(--panel);border:1px solid var(--dim);padding:18px;border-radius:8px;max-width:360px;width:100%}
#login input{width:100%;margin:10px 0}
.empty{color:var(--dim);padding:10px}
#rwStatus{font-size:11px}
#scope{background:#2b2b2b}
.twmount .atis{margin-top:6px;border-top:1px solid var(--faint);padding-top:6px;font-size:12px}
.twmount .atis input{width:100%;box-sizing:border-box;margin-top:4px}
.twmount .atis .ctl{display:flex;gap:6px;margin-top:6px}
.twmount .atis .hd{color:var(--cy);font-weight:700}
.twmount .atis .raw{opacity:.6;word-break:break-all;margin-top:2px}
.twmount{margin-top:6px;border-top:1px solid var(--faint);padding-top:2px}
.twmount .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
#rwStatus button{padding:1px 6px;font-size:11px}
#bgmap{position:absolute;inset:0;z-index:0}
#rwcv,#lblmap{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#rwcv{z-index:1}#lblmap{z-index:2}#radar{z-index:3}
#attr{position:absolute;right:4px;bottom:2px;z-index:2;font-size:8px;color:#8c8c8c;opacity:.65;pointer-events:auto}#attr a{color:inherit;text-decoration:underline}
.maplibregl-canvas{outline:none}
.ptt{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:#1b5e3a;color:#fff;border:1px solid #3dff7a;border-radius:6px;padding:8px 12px;font-weight:700}
.ptt.rec{background:#c0392b;border-color:#ff8a80}.ptt.off{opacity:.4}
#voiceBtn.on{border-color:#3dff7a;color:#3dff7a}
#main{position:relative}
#gate{position:absolute;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:14px;display:none}
#gateIn{max-width:520px;margin:0 auto}
#gate h2{margin:4px 0 10px;font-size:15px;letter-spacing:.12em;color:var(--cy)}
#gate .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#gate .gcard{cursor:pointer}#gate .gcard.nc{cursor:default}
#gate .gcard b{font-size:14px}
#gate .roles{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
#gate .tag{padding:1px 6px;border:1px solid var(--faint);border-radius:10px;font-size:11px;color:var(--dim)}
#gate .tag.t{border-color:var(--amber);color:var(--amber)}
#gate .gform{display:flex;gap:6px;margin:10px 0}
#gate .gform input{width:110px;letter-spacing:.1em}
#gate .desc{color:var(--dim);font-size:11px;margin-top:2px}
#evlog{position:absolute;left:6px;top:6px;z-index:4;width:min(330px,70%);font-size:10px;background:rgba(4,7,4,.72);border:1px solid var(--faint);border-radius:4px}
#evlog .hd{padding:2px 6px;color:var(--dim);cursor:pointer;user-select:none}
#evlog .bd{max-height:88px;overflow:auto;padding:0 6px 3px}
#evlog .e{color:var(--fg)}#evlog .e.out{color:var(--cy)}#evlog .e.warn{color:var(--amber)}#evlog .e.bad{color:var(--red)}
#evlog .e i{font-style:normal;color:var(--dim)}
#talkRow{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <b>ATC</b>
    <select id="range" title="Range (nm)"></select>
    <button id="ctrSel" title="Center scope on the selected aircraft">Center sel</button>
    <input id="ll" size="16" placeholder="lat, lon or ICAO" title="Center on coordinates or an airport code">
    <button id="llGo">Go</button>
    <button id="menuBtn" title="Menu" aria-label="Menu" style="font-size:16px;line-height:1">&#9776;</button>
    <button id="autoMsgBtn" title="Send the pilot a text when you grant a clearance">Auto msg: on</button>
    <button id="replayVoiceBtn" title="Replay the last voice message (sent or received). Plays locally, nothing is transmitted." disabled>Replay last</button>
    <div id="menu" style="display:none"><button id="voiceBtn" title="Voice on/off">Voice: on</button>
    <button id="acctBtn" title="Account: your hours and profile follow you on every device">Account</button>
    <button id="grpBtn" title="Aerofly Connect ATC Network code (from Discord)">ATC Network</button>
    <button id="credBtn" title="ATC credential issued by the network management: lets you open towers in the network" disabled>ATC Credential</button>
    <button id="dimBtn" title="Grey out aircraft that are not on my frequencies (they stay visible)">My freqs: off</button>
    <button id="wpBtn" title="Waypoints: show all, or only those used by pilots' routes">Waypoints: all</button>
    <button id="trainBtn" title="ATC training with AI traffic (offline simulation)">Training</button></div>
    <span id="rwStatus" class="m"></span>
    <span id="status">offline</span>
  </div>
  <div id="main">
    <div id="scope"><div id="bgmap"></div><canvas id="rwcv"></canvas><div id="lblmap"></div><canvas id="radar"></canvas><div id="evlog"><div class="hd" id="evHd"></div><div class="bd" id="evBd"></div></div><div id="attr">© OSM · OpenFreeMap · Contains data from <a href="https://github.com/laegsgaardTroels/whatisflying-db" target="_blank" rel="noopener">What is flying?</a>, available under <a href="https://opendatacommons.org/licenses/odbl/1-0/" target="_blank" rel="noopener">ODbL 1.0</a>.</div></div>
    <div id="gate"><div id="gateIn"><h2 id="gHead"></h2><div id="gMsg" class="m" style="min-height:18px;margin:0 0 6px;color:var(--amber)"></div><div id="gList"></div>
      <div id="gOpen" class="gform"><input id="gIcao" maxlength="8" autocapitalize="characters" placeholder="SBBR"><button id="gOpenBtn"></button></div>
      <div id="gWatchRow"><button id="gWatch"></button></div></div></div>
    <div id="strips">
      <div id="twrbox" class="strip twr">
        <div class="h"><span class="cs" id="wkTitle">Towers</span></div>
        <div class="ctl" id="wkCtl"><button id="wkFreq"></button><button id="wkLeave"></button></div>
        <div class="ctl" style="display:none"><input id="twIcao" maxlength="8" placeholder="SBBR" autocapitalize="characters" style="width:96px;letter-spacing:.1em">
          <button id="twOpen">Open airport</button></div>
        <div id="talkRow" class="m" style="display:none;margin-top:4px">Talk on <select id="talkOn"></select></div>
        <div id="twList" style="display:none"></div>
      </div>
      <div id="list"></div>
    </div>
  </div>
</div>
<div id="login"><div>
  <b>Abflug ATC</b>
  <p class="m">Enter your API key. It is stored only in this browser.</p>
  <input id="keyIn" type="password" autocomplete="off" placeholder="API key">
  <button id="keySave">Connect</button>
  <p id="keyErr" class="bad"></p>
</div></div>
<div id="toast"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var cv=$('radar'),g=cv.getContext('2d'),rwc=$('rwcv'),gR=rwc.getContext('2d');
var LANG=(new URLSearchParams(location.search).get('lang')||'')==='pt'?'pt':'en';
function L(en,pt){return LANG==='pt'?pt:en}

if(LANG==='pt'){document.documentElement.lang='pt';
  var T={ctrSel:['Centralizar sel.'],llGo:['Ir'],twOpen:['Abrir torre'],keySave:['Conectar']};
  Object.keys(T).forEach(function(k){var e=$(k);if(e)e.textContent=T[k][0]});
  $('ll').placeholder='lat, lon ou ICAO';$('range').title='Alcance (nm)';
  var tw=document.querySelector('#twrbox .cs');if(tw)tw.textContent='Torres';
  var lp=document.querySelector('#login .m');if(lp)lp.textContent='Digite sua chave de API. Ela fica salva só neste navegador.';
  $('keyIn').placeholder='Chave de API'}
var urgent=false;
var key='';try{key=new URLSearchParams(location.search).get('key')||localStorage.getItem('abflug_key')||''}catch(e){}
/* no key yet (e.g. PC browser): make one so nobody has to type it; the login box only shows if the server rejects it */
if(!key){var _a='';try{var _b=new Uint8Array(8);crypto.getRandomValues(_b);for(var _i=0;_i<8;_i++)_a+=('0'+_b[_i].toString(16)).slice(-2)}catch(e){for(var _j=0;_j<16;_j++)_a+=Math.floor(Math.random()*16).toString(16)}
  key='rv'+_a;try{localStorage.setItem('abflug_key',key)}catch(e){}}
var tok='',acctName='',devKey=key,fromApp=false;try{tok=localStorage.getItem('afc_token')||'';acctName=localStorage.getItem('afc_acct')||''}catch(e){}
if(key.indexOf('afa_')===0){tok=key;devKey='';fromApp=true}else if(tok)key=tok;
var ac=[],crashes=[],confl={},hasViol=false,msgs=[],sel=null,center={lat:0,lon:0},manual=false,centroidDone=false,nmpp=0.25,W=300,H=300;
var trails={},TRACE_MS=30*60*1000,RK='afc_rtrails_v1',ranges=[1,2,5,10,25,50,100,250,500,1000];

// traces live 30 min and survive closing the radar (saved in local storage)
function loadTrails(){try{var j=JSON.parse(localStorage.getItem(RK)||'null');if(!j)return;var now=Date.now();
  Object.keys(j).forEach(function(id){var o=j[id],r=[];if(!o)return;
    for(var i=0;i<o.length;i++)if(now-o[i][2]<=TRACE_MS)r.push({latitude:o[i][0],longitude:o[i][1],t:o[i][2]});
    if(r.length)trails[id]=r})}catch(e){}}
function saveTrails(){try{var now=Date.now(),o={};
  Object.keys(trails).forEach(function(id){var r=[];trails[id].forEach(function(p){if(now-p.t<=TRACE_MS)r.push([Math.round(p.latitude*1e5)/1e5,Math.round(p.longitude*1e5)/1e5,p.t])});if(r.length)o[id]=r});
  localStorage.setItem(RK,JSON.stringify(o))}catch(e){}}
loadTrails();setInterval(saveTrails,15000);
document.addEventListener('visibilitychange',function(){if(document.hidden)saveTrails()});
window.addEventListener('pagehide',saveTrails);
window.saveTrails=saveTrails;

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function p3(n){n=Math.round(n);return (n<100?'0':'')+(n<10?'0':'')+n}
function vsStr(v){v=Math.round((Number(v)||0)/50)*50;return 'VS '+(v>0?'+':'')+v+' fpm';}
function altStr(ft){if(ft==null||isNaN(ft))return '---';return ft>=TA?'FL'+p3(ft/100):'A'+p3(ft/100)}
var TA=5000; /* transition altitude (ft): FL above, A (altitude in hundreds) below */
function isTwr(a){return /^ATC_/i.test(a.callsign||'')}
function rel(a){var dy=(a.latitude-center.lat)*60,dx=(a.longitude-center.lon)*60*Math.cos(center.lat*Math.PI/180);
  return{dx:dx,dy:dy,dist:Math.hypot(dx,dy),brg:(Math.atan2(dx,dy)*180/Math.PI+360)%360}}
function projLL(lat,lon){var dy=(lat-center.lat)*60,dx=(lon-center.lon)*60*Math.cos(center.lat*Math.PI/180);return[W/2+dx/nmpp,H/2-dy/nmpp]}
function proj(a){return projLL(a.latitude,a.longitude)}
function toast(t){var gm=$('gMsg');if(gm&&$('gate').style.display!=='none')gm.textContent=t;var e=$('toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},2500)}

/* ---------- runway data (OurAirports, loaded in the browser and cached) ---------- */
var RW=[],APT={},rwState='idle';
var RW_URLS=['https://davidmegginson.github.io/ourairports-data/runways.csv','https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/runways.csv'];
function idbOpen(cb){try{var o=indexedDB.open('abflug-atc',1);o.onupgradeneeded=function(){o.result.createObjectStore('kv')};o.onsuccess=function(){cb(o.result)};o.onerror=function(){cb(null)}}catch(e){cb(null)}}
function idbGet(k){return new Promise(function(res){idbOpen(function(db){if(!db)return res(null);try{var r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=function(){res(r.result||null)};r.onerror=function(){res(null)}}catch(e){res(null)}})})}
function idbSet(k,v){idbOpen(function(db){if(!db)return;try{db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}})}
function parseCSV(t){var lines=t.split('\n'),rows=[];
  for(var i=0;i<lines.length;i++){var l=lines[i];if(l.charCodeAt(l.length-1)===13)l=l.slice(0,-1);if(!l)continue;
    if(l.indexOf('"')<0){rows.push(l.split(','));continue}
    var row=[],f='',q=false;for(var j=0;j<l.length;j++){var c=l[j];
      if(q){if(c==='"'){if(l[j+1]==='"'){f+='"';j++}else q=false}else f+=c}
      else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else f+=c}
    row.push(f);rows.push(row)}
  return rows}
function buildRunways(rows){var h={};rows[0].forEach(function(n,i){h[n.replace(/"/g,'')]=i});
  var need=['airport_ident','le_ident','le_latitude_deg','le_longitude_deg','he_ident','he_latitude_deg','he_longitude_deg'];
  for(var n=0;n<need.length;n++)if(!(need[n] in h))throw new Error('unexpected runway file format');
  var out=[];for(var i=1;i<rows.length;i++){var r=rows[i];if(r[h.closed]==='1')continue;
    var a=parseFloat(r[h.le_latitude_deg]),b=parseFloat(r[h.le_longitude_deg]),c=parseFloat(r[h.he_latitude_deg]),d=parseFloat(r[h.he_longitude_deg]);
    if(!isFinite(a)||!isFinite(b)||!isFinite(c)||!isFinite(d))continue;
    out.push([r[h.airport_ident],r[h.le_ident],a,b,r[h.he_ident],c,d,parseFloat(r[h.width_ft])||0])}
  return out}
function useRunways(list){RW=list;APT={};
  list.forEach(function(r){var k=r[0],a=APT[k]||(APT[k]={lat:0,lon:0,n:0});a.lat+=r[2]+r[5];a.lon+=r[3]+r[6];a.n+=2});
  Object.keys(APT).forEach(function(k){var a=APT[k];a.lat/=a.n;a.lon/=a.n});
  rwState='ready';$('rwStatus').textContent='runways: '+Object.keys(APT).length+' airports';draw()}
function loadRunways(){rwState='loading';$('rwStatus').textContent='runways: loading...';
  idbGet('runways').then(function(c){
    if(c&&c.data&&Date.now()-c.t<30*86400000){useRunways(c.data);return}
    var i=0;(function next(){if(i>=RW_URLS.length){rwState='failed';
        $('rwStatus').innerHTML='runways unavailable <button id="rwRetry">Retry</button>';return}
      fetch(RW_URLS[i++]).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
        var data=buildRunways(parseCSV(t));useRunways(data);idbSet('runways',{t:Date.now(),data:data})}).catch(next)})()})}
$('rwStatus').addEventListener('click',function(e){if(e.target.id==='rwRetry')loadRunways()});
var FQ={},FQ_URLS=['https://davidmegginson.github.io/ourairports-data/airport-frequencies.csv','https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/airport-frequencies.csv'];
var FQ_MAP={GND:['GND'],TWR:['TWR'],APP:['APP','DEP'],CTR:['CTR','ACC','APP']};
function useFq(m){FQ=m;try{if(typeof renderTowerBox==='function')renderTowerBox()}catch(e){}}
function loadFreqs(){idbGet('apfreq').then(function(c){
  if(c&&c.data&&Date.now()-c.t<30*86400000){useFq(c.data);return}
  var i=0;(function next(){if(i>=FQ_URLS.length)return;
    fetch(FQ_URLS[i++]).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
      var rows=parseCSV(t),h={};rows[0].forEach(function(n,k){h[n.replace(/"/g,'')]=k});var m={};
      for(var k=1;k<rows.length;k++){var r=rows[k],id=r[h.airport_ident],ty=(r[h.type]||'').toUpperCase(),f=parseFloat(r[h.frequency_mhz]);
        if(!id||!isFinite(f)||f<118||f>136.975)continue;var o=m[id]||(m[id]={});if(!o[ty])o[ty]=f.toFixed(3)}
      useFq(m);idbSet('apfreq',{t:Date.now(),data:m})}).catch(next)})()})}
function defFreq(apt,r){var o=FQ[apt];if(!o)return '';var l=FQ_MAP[r]||[r];for(var i=0;i<l.length;i++)if(o[l[i]])return o[l[i]];return ''}


/* ---------- global waypoint fixes (What is flying? database; ODbL-1.0) ---------- */
var FIXES=[],FIX_GRID={},fixState='idle';
var FIX_URL='https://raw.githubusercontent.com/laegsgaardTroels/whatisflying-db/master/data/fixes.csv';
function buildFixes(rows){
  if(!rows.length)throw new Error('empty fixes dataset');
  var h={};rows[0].forEach(function(n,i){h[String(n).replace(/^\uFEFF/,'').trim().replace(/^"|"$/g,'')]=i});
  var need=['identifier','latitude','longitude','usage','region'];
  for(var n=0;n<need.length;n++)if(!(need[n] in h))throw new Error('unexpected fixes file format');
  var out=[];

function draw(){
  syncBg();if(bgOK)g.clearRect(0,0,W,H);else{g.fillStyle='#2b2b2b';g.fillRect(0,0,W,H)}
  var maxR=Math.hypot(W,H)/2*nmpp,steps=[1,2,5,10,20,50,100,200,500,1000],step=steps[steps.length-1];
  for(var i=0;i<steps.length;i++){if(steps[i]/nmpp>=70){step=steps[i];break}}
  g.lineWidth=1;g.font='10px ui-monospace,monospace';g.strokeStyle='rgba(61,255,122,.22)';g.fillStyle='rgba(61,255,122,.5)';
  for(var r=step;r<=maxR*1.2&&r<=3000;r+=step){var px=r/nmpp;g.beginPath();g.arc(W/2,H/2,px,0,6.2832);g.stroke();g.fillText(r+'',W/2+px+2,H/2-2)}
  g.textBaseline='top';
  var gM=g;if(bgOK){g=gR;gR.clearRect(0,0,W,H)}try{drawRunways(maxR)}finally{g=gM}   /* no map underlay: runways stay on the radar canvas */
  drawFixes(maxR);

  var blinkOn=Math.floor(Date.now()/450)%2===0;
  for(var k=0;k<ac.length;k++){var cf0=confl[ac[k].icao_address];if(!cf0)continue;
    var cxy=proj(ac[k]),cr=Math.max(16,cf0.r/nmpp);
    if(cf0.lvl===2){g.lineWidth=2.5;g.strokeStyle=blinkOn?'#ff3b30':'rgba(255,59,48,.3)';g.fillStyle=blinkOn?'rgba(255,59,48,.14)':'rgba(255,59,48,0)';
      g.beginPath();g.arc(cxy[0],cxy[1],cr,0,6.2832);g.fill();g.stroke()}
    else{g.lineWidth=1.5;g.strokeStyle='rgba(255,176,0,.85)';g.beginPath();g.arc(cxy[0],cxy[1],cr,0,6.2832);g.stroke()}}
  for(var k=0;k<ac.length;k++){var a=ac[k],id=a.icao_address,xy=proj(a),x=xy[0],y=xy[1];
    if(x<-60||y<-40||x>W+60||y>H+40)continue;
    var tw=isTwr(a),isSel=sel===id,asg=a.assigned_squawk,dm=isDim(a)&&!isSel;if(dm)g.globalAlpha=.3;
    var col=isSel?'#7ae9ff':tw?(a.member?'#ffd23f':'#ff7ae9'):!asg?'#ffb000':'#3dff7a';
    var cf=confl[id];if(cf&&cf.lvl===2&&blinkOn)col='#ff3b30';if(a.emergency)col=blinkOn?'#ff3b30':'#ffd0cc';
    var tr=trails[id]||[];g.strokeStyle=col;g.globalAlpha=.45;
    g.fillStyle=col;for(var t=0;t<tr.length;t++){var q=proj(tr[t]);if(q[0]<-5||q[1]<-5||q[0]>W+5||q[1]>H+5)continue;g.fillRect(q[0]-1,q[1]-1,2,2)}
    g.globalAlpha=dm?.3:1;
    if(tw){drawTower(g,x,y,24,col,'#2b2b2b')}
    else{g.strokeStyle=col;g.lineWidth=isSel?2:1.5;g.strokeRect(x-4,y-4,8,8);
      var gs=Number(a.ground_speed)||0,hd=(Number(a.heading_true)||0)*Math.PI/180;
      if(gs>3){var len=Math.min(60,(gs/60)/nmpp);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.sin(hd)*len,y-Math.cos(hd)*len);g.stroke()}}
    g.fillStyle=col;g.font='11px ui-monospace,monospace';g.textBaseline='top';
    g.fillText((a.callsign||id)+(!tw&&a.nick?' ('+a.nick+')':'')+(tw?BAR(a.owner_stripes):BAR(a.stripes)),x+(tw?15:9),y-12);
    if(!tw&&a.airplane_model){g.textAlign='center';g.fillText(String(a.airplane_model).slice(0,12),x,y-25);g.textAlign='left'}
    if(!tw)g.fillText(altStr(a.altitude_ft)+' '+Math.round(Number(a.ground_speed)||0)+'kt'+(asg?'  '+asg:''),x+9,y-1);
    if(!tw)g.fillText((a.freq||'')+' '+ctrlOf(a),x+9,y+10);
    if(isSel){g.strokeStyle='#7ae9ff';g.lineWidth=1;g.beginPath();g.arc(x,y,13,0,6.2832);g.stroke()}
    g.globalAlpha=1;
  }
  /* crash sites: a red X, kept for 10 min; the pilot is locked out for the first 5 */
  crashes.forEach(function(c){var q=projLL(c.latitude,c.longitude),x=q[0],y=q[1];if(x<-40||y<-40||x>W+40||y>H+40)return;
    [['#fff',6],['#ff3b30',3.5]].forEach(function(o){g.strokeStyle=o[0];g.lineWidth=o[1];g.lineCap='round';
      g.beginPath();g.moveTo(x-9,y-9);g.lineTo(x+9,y+9);g.moveTo(x+9,y-9);g.lineTo(x-9,y+9);g.stroke()});
    g.lineCap='butt';g.fillStyle='#ff3b30';g.font='bold 11px ui-monospace,monospace';g.textBaseline='top';
    g.fillText((c.reason==='midair'?L('MIDAIR ','COLISÃO '):L('CRASH ','ACIDENTE '))+(c.callsign||''),x+13,y-6)});
}

  var dx=e.offsetX-p.x,dy=e.offsetY-p.y;if(Math.abs(e.offsetX-startPt.x)+Math.abs(e.offsetY-startPt.y)>6)moved=true;

function brg(a,b,c,d){var r=Math.PI/180,y=Math.sin((d-b)*r)*Math.cos(c*r),x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r);return(Math.atan2(y,x)/r+360)%360}

function refreshMyTowers(){if(!key)return;myApts.slice().forEach(function(t){putTower(t,true).then(function(r){if(r.status===409||r.status===403)r.json().then(function(j){if(j.error==='one_tower'){myApts=myApts.filter(function(x){return x.name!==t.name});saveTowers();poll(true)}})}).catch(function(){})});myTowers.slice().forEach(function(t){putTower(t).then(function(r){if(r.status===409||r.status===403){r.json().then(function(j){myTowers=myTowers.filter(function(x){return x.name!==t.name});saveTowers();updateTalk();errToast(r,j)})}}).catch(function(){})})}

/* ---------- polling ---------- */
function setStatus(t,ok){var s=$('status');s.textContent=t;s.className=ok?'ok':''}
function poll(force){
  if(!key){showLogin('');return}
  if(document.hidden&&!force)return;
  if(!force&&wsLive())return;
  api('/api/traffic?lat=0&lon=0&radius_miles=13000').then(function(r){
    if(r.status===401){if(tok&&!fromApp){dropToken();toast(L('Signed out: session expired','Sessão expirada, saiu da conta'));return null}key='';try{localStorage.removeItem('abflug_key')}catch(e){}showLogin('Invalid key');return null}
    return r.json()}).then(function(j){if(!j)return;applyTraffic(j)
  }).catch(function(){setStatus(L('offline','sem conexão'),false)})}
function applyTraffic(j){
    msgs=j.atc_messages||[];crashes=j.crashes||[];onClips(j.voice_clips||[]);
    ac=(j.aircraft||[]).filter(function(a){return isFinite(a.latitude)&&isFinite(a.longitude)&&a.icao_address});
    ac.forEach(function(a){var t=trails[a.icao_address]=trails[a.icao_address]||[],l=t[t.length-1];
      if(!l||Math.abs(l.latitude-a.latitude)+Math.abs(l.longitude-a.longitude)>0.0005){var now=Date.now();t.push({latitude:a.latitude,longitude:a.longitude,t:now});while(t.length&&now-t[0].t>TRACE_MS)t.shift()}});
    if(!manual){var tw=ac.filter(isTwr)[0];if(tw){center.lat=tw.latitude;center.lon=tw.longitude}
      else if(!centroidDone&&ac.length){center.lat=ac.reduce(function(s,a){return s+a.latitude},0)/ac.length;
        center.lon=ac.reduce(function(s,a){return s+a.longitude},0)/ac.length;centroidDone=true}}
    computeConfl();evDiff();
    var nT=ac.filter(isTwr).length,nA=ac.length-nT;setStatus(nA+L(' aircraft',' aeronaves')+' · '+nT+L(nT===1?' tower':' towers',nT===1?' torre':' torres')+(isMember?L(' · private ATC Network section',' · seção privada da ATC Network'):'')+grpMsg,true);draw();renderStrips();renderTowerBox();gateSync()}
/* ---------- voice (push-to-talk, both directions) ---------- */
var voiceOn=true,vclips=[],heard=null,pttBusy=false,actx=null,rec=null,lastBuf=null,liveRx={};
try{voiceOn=localStorage.getItem('afc_voice')!=='0'}catch(e){}
if(/[?&]voice=0/.test(location.search))voiceOn=false;
function ac_(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx}
document.addEventListener('pointerdown',function(){ac_()},{once:true});
function wsCall(path,body){var o={id:'v'+Date.now(),method:'PUT',path:path,body:body};
  if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return}
  api(path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(function(){})}
function listen(){wsCall('/api/voice/listen',{on:voiceOn})}
function setVoiceBtn(){var b=$('voiceBtn');b.textContent=L('Voice: ','Voz: ')+(voiceOn?L('on','ligada'):L('off','desligada'));b.className=voiceOn?'on':''}
$('voiceBtn').onclick=function(){voiceOn=!voiceOn;try{localStorage.setItem('afc_voice',voiceOn?'1':'0')}catch(e){}setVoiceBtn();ac_();listen();renderStrips(true)};
setVoiceBtn();setInterval(listen,25000);setTimeout(listen,1500);
function onClips(list){vclips=list;
  if(heard===null){heard={};list.forEach(function(v){heard[v.id]=1});return}
  list.forEach(function(v){if(!heard[v.id]){heard[v.id]=1;if(voiceOn&&isHeard(v.freq))playClip(v.id)}})}
function b64buf(b){var s=atob(b),n=s.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=s.charCodeAt(i);return u.buffer}
function playClip(id){
  api('/api/voice/clip?id='+encodeURIComponent(id)).then(function(r){return r.ok?r.json():null}).then(function(j){
    if(!j){toast(L('Clip expired','Áudio expirado'));return}
    var c=ac_();if(!c){toast(L('Audio not available','Áudio indisponível'));return}
    c.decodeAudioData(b64buf(j.audio),function(buf){playBuf(buf)},function(){toast(L('Cannot play clip','Não foi possível tocar'))})
  }).catch(function(){toast(L('Network error','Erro de rede'))})}
function playBuf(buf){lastBuf=buf;$('replayVoiceBtn').disabled=false;var c=ac_();if(!c)return;
      var src=c.createBufferSource();src.buffer=buf;
      var hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=420;
      var lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2800;
      var g=c.createGain();g.gain.value=1.6;src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(c.destination);
      var t=c.currentTime+.05;src.start(t);
      var n=Math.floor(c.sampleRate*.07),nb=c.createBuffer(1,n,c.sampleRate),d=nb.getChannelData(0);
      for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*.25*(1-i/n);
      var ns=c.createBufferSource();ns.buffer=nb;var ng=c.createGain();ng.gain.value=.5;ns.connect(ng);ng.connect(c.destination);ns.start(t+buf.duration)}
$('replayVoiceBtn').onclick=function(){if(lastBuf)playBuf(lastBuf)};
function pcmB64(f){var a=new Int16Array(f.length);for(var i=0;i<f.length;i++)a[i]=Math.max(-32768,Math.min(32767,Math.round(f[i]*32767)));var u=new Uint8Array(a.buffer),s='';for(var j=0;j<u.length;j++)s+=String.fromCharCode(u[j]);return btoa(s)}
function pcmFromB64(b){var u=b64buf(b);return new Int16Array(u)}
function streamPlay(chunks,sr){var total=0;chunks.forEach(function(x){total+=x.length});if(!total)return;var all=new Int16Array(total),off=0;chunks.forEach(function(x){all.set(x,off);off+=x.length});var c=ac_();if(!c)return;var buf=c.createBuffer(1,all.length,sr||16000),d=buf.getChannelData(0);for(var i=0;i<all.length;i++)d[i]=all[i]/32768;lastBuf=buf;$("replayVoiceBtn").disabled=false}
function voiceStreamEvent(j){
 if(!j||!j.id)return;var r=liveRx[j.id];
 if(j.event==='start'||j.event==='replay_start'){var c=ac_();liveRx[j.id]=r={chunks:[],sr:Number(j.meta&&j.meta.sampleRate)||16000,next:c?c.currentTime+.045:0,ctx:c};return}
 if(!r)return;
 if(j.event==='chunk'&&j.data){try{var pcm=pcmFromB64(j.data);r.chunks.push(pcm);if(r.ctx&&pcm.length){var b=r.ctx.createBuffer(1,pcm.length,r.sr),d=b.getChannelData(0);for(var i=0;i<pcm.length;i++)d[i]=pcm[i]/32768;var src=r.ctx.createBufferSource();src.buffer=b;src.connect(r.ctx.destination);var when=Math.max(r.ctx.currentTime+.015,r.next);src.start(when);r.next=when+b.duration;}}catch(e){}}
 if(j.event==='end'||j.event==='replay_end'){var total=0;r.chunks.forEach(function(x){total+=x.length});if(total){var all=new Int16Array(total),off=0;r.chunks.forEach(function(x){all.set(x,off);off+=x.length});var c=ac_(),buf=c.createBuffer(1,all.length,r.sr),d=buf.getChannelData(0);for(var i=0;i<all.length;i++)d[i]=all[i]/32768;lastBuf=buf;$('replayVoiceBtn').disabled=false;}delete liveRx[j.id];}
}
function pttStart(btn){
  if(!voiceOn){toast(L('Turn Voice on first','Ligue a voz primeiro'));return}
  if(btn.getAttribute('data-voice')==='0'){toast(btn.getAttribute('data-cs')+L(" can't listen to voice, send text instead",' não pode ouvir voz, envie texto'));return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.AudioContext){toast(L('Live microphone not supported','Microfone ao vivo indisponível'));return}
  if(!ws||ws.readyState!==1){toast(L('Live connection unavailable','Conexão ao vivo indisponível'));return}
  pttBusy=true;btn.classList.add('rec');btn.textContent=L('LIVE PTT · release to stop','PTT AO VIVO · solte para parar');
  var cancelled=false,streamId='atc'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),st=null,src=null,proc=null,ctx=null,sent=0,localChunks=[];
  rec={cancel:function(){cancelled=true}};
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}}).then(function(media){
    if(!pttBusy||cancelled){media.getTracks().forEach(function(t){t.stop()});return}st=media;ctx=ac_();src=ctx.createMediaStreamSource(st);proc=ctx.createScriptProcessor(2048,1,1);
    ws.send(JSON.stringify({voice_stream:'start',id:streamId,direction:'down',holder:holder,icao_address:btn.getAttribute('data-icao'),freq:talkFreq(),sampleRate:ctx.sampleRate}));
    proc.onaudioprocess=function(e){if(!pttBusy||!ws||ws.readyState!==1)return;var f=e.inputBuffer.getChannelData(0),chunk=new Float32Array(f);if(sent<20000){var b=pcmB64(chunk);ws.send(JSON.stringify({voice_stream:'chunk',id:streamId,data:b}));localChunks.push(pcmFromB64(b));sent+=chunk.length*1000/ctx.sampleRate}var out=e.outputBuffer.getChannelData(0);out.fill(0)};
    src.connect(proc);proc.connect(ctx.destination);rec={cancel:function(){cancelled=true}};
    rec.stop=function(){try{proc.disconnect();src.disconnect()}catch(e){};if(st)st.getTracks().forEach(function(t){t.stop()});if(ws&&ws.readyState===1)ws.send(JSON.stringify({voice_stream:'end',id:streamId}));streamPlay(localChunks,ctx?ctx.sampleRate:16000);};
  }).catch(function(){pttBusy=false;toast(L('Microphone blocked','Microfone bloqueado'));renderStrips(true)})}
function pttStop(){if(!pttBusy)return;pttBusy=false;if(rec&&rec.stop)rec.stop();else if(rec&&rec.cancel)rec.cancel();rec=null;renderStrips(true)}
$('strips').addEventListener('pointerdown',function(e){var b=e.target.closest('#ptt');if(b){e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}pttStart(b)}});
['pointerup','pointercancel'].forEach(function(n){$('strips').addEventListener(n,function(e){if(e.target.closest('#ptt'))pttStop()})});
$('strips').addEventListener('contextmenu',function(e){if(e.target.closest('#ptt'))e.preventDefault()});
/* ---------- WebSocket (push); polling stays as fallback ---------- */
var ws=null,wsAt=0,wsTry=0,wsTimer=0,wsPing=0;
function wsLive(){return ws&&ws.readyState===1&&Date.now()-wsAt<12000}
function wsOpen(){
  if(!key||!window.WebSocket||ws)return;
  try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?key='+encodeURIComponent(key)+'&mode='+mode+(group?'&group='+encodeURIComponent(group):'')+(atcCode?'&atc='+encodeURIComponent(atcCode):'')+'&holder='+encodeURIComponent(holder))}catch(e){ws=null;return}
  var me=ws;
  me.onopen=function(){wsTry=0;wsAt=Date.now();setTimeout(listen,300);me.send(JSON.stringify({sub:{lat:0,lon:0,radius_miles:13000}}));
    clearInterval(wsPing);wsPing=setInterval(function(){if(me.readyState===1)me.send('ping')},25000)};
  me.onmessage=function(e){if(e.data==='pong')return;var j;try{j=JSON.parse(e.data)}catch(x){return}
    if(j&&j.id&&wsPend[j.id]){wsPend[j.id].ok(j);return}
    if(j&&j.push==='traffic'){wsAt=Date.now();applyTraffic(j);return}if(j&&j.push==='voice_stream'){voiceStreamEvent(j)}};
  me.onclose=function(){if(ws===me)ws=null;clearInterval(wsPing);Object.keys(wsPend).forEach(function(k){wsPend[k].bad()});
    clearTimeout(wsTimer);wsTimer=setTimeout(wsOpen,Math.min(30000,2000*Math.pow(2,Math.min(wsTry++,4))))};
  me.onerror=function(){try{me.close()}catch(x){}};
}
document.addEventListener('visibilitychange',function(){if(!document.hidden){if(!ws)wsOpen();poll(true)}});
initBg();resize();applyRange();draw();loadRunways();loadFreqs();loadFixes();updateTalk();refreshMyTowers();setInterval(refreshMyTowers,45000);poll(true);setInterval(poll,5000);wsOpen();
})();
